<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 740" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#334155"/></marker>
  </defs>
  <rect width="1100" height="740" fill="#ffffff"/>
  <text x="550" y="40" text-anchor="middle" font-size="24" font-weight="700" fill="#0f172a">밤사이 작업 결과물 미리보기 (약 6시간)</text>

  <!-- 카드 공통 -->
  <g fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5">
    <rect x="30" y="65" width="330" height="225" rx="12"/><rect x="385" y="65" width="330" height="225" rx="12"/><rect x="740" y="65" width="330" height="225" rx="12"/>
    <rect x="30" y="310" width="330" height="225" rx="12"/><rect x="385" y="310" width="330" height="225" rx="12"/><rect x="740" y="310" width="330" height="225" rx="12"/>
  </g>
  <g font-size="17" font-weight="700" fill="#0f172a">
    <text x="48" y="95">① 모듈 상세 설계</text><text x="403" y="95">② 치수 들어간 도면</text><text x="758" y="95">③ 합체 형태 4가지</text>
    <text x="48" y="340">④ 합체 시뮬레이션</text><text x="403" y="340">⑤ 웹 3D 뷰어</text><text x="758" y="340">⑥ 사업계획서 초안</text>
  </g>
  <g font-size="13" fill="#475569">
    <text x="48" y="272">모터·배터리·기판·잠금장치 배치</text>
    <text x="403" y="272">협력업체에 보낼 수 있는 PDF·DXF</text>
    <text x="758" y="272">일렬·사각·ㄴ자·적층, 3D 파일</text>
    <text x="48" y="517">혼자 못 미는 짐을 4대가 미는 영상</text>
    <text x="403" y="517">브라우저에서 돌려 보고 치수 변경</text>
    <text x="758" y="517">시장·경쟁·로드맵·필요 자금</text>
  </g>

  <!-- ① 내부 배치 평면도 -->
  <g transform="translate(120,110)" stroke="#334155" stroke-width="1.5" fill="none">
    <rect x="0" y="0" width="150" height="140" rx="10" fill="#ffffff"/>
    <rect x="12" y="8" width="34" height="20" fill="#cbd5e1"/><rect x="104" y="8" width="34" height="20" fill="#cbd5e1"/>
    <rect x="12" y="112" width="34" height="20" fill="#cbd5e1"/><rect x="104" y="112" width="34" height="20" fill="#cbd5e1"/>
    <rect x="40" y="40" width="70" height="26" fill="#fde68a"/><rect x="40" y="74" width="70" height="26" fill="#bbf7d0"/>
    <rect x="-8" y="60" width="8" height="8" fill="#334155"/><rect x="150" y="72" width="8" height="8" fill="#334155"/>
  </g>
  <g font-size="11" fill="#334155"><text x="178" y="167">배터리</text><text x="182" y="201">기판</text></g>

  <!-- ② 치수 도면 -->
  <g transform="translate(475,125)" stroke="#334155" stroke-width="1.5" fill="none">
    <rect x="0" y="0" width="150" height="80" fill="#ffffff"/>
    <circle cx="50" cy="30" r="6"/><circle cx="100" cy="30" r="6"/><circle cx="75" cy="45" r="9"/>
    <line x1="0" y1="100" x2="150" y2="100" marker-start="url(#ar)" marker-end="url(#ar)"/>
    <line x1="0" y1="84" x2="0" y2="106"/><line x1="150" y1="84" x2="150" y2="106"/>
    <line x1="172" y1="0" x2="172" y2="80" marker-start="url(#ar)" marker-end="url(#ar)"/>
    <line x1="154" y1="0" x2="178" y2="0"/><line x1="154" y1="80" x2="178" y2="80"/>
  </g>
  <g font-size="13" fill="#0f172a"><text x="550" y="243" text-anchor="middle">120</text><text x="662" y="170">60</text></g>

  <!-- ③ 합체 형태 -->
  <g stroke="#334155" stroke-width="1.5" fill="#bfdbfe">
    <g transform="translate(765,120)"><rect width="26" height="26"/><rect x="26" width="26" height="26"/><rect x="52" width="26" height="26"/><rect x="78" width="26" height="26"/></g>
    <g transform="translate(900,112)"><rect width="26" height="26"/><rect x="26" width="26" height="26"/><rect y="26" width="26" height="26"/><rect x="26" y="26" width="26" height="26"/></g>
    <g transform="translate(790,180)"><rect width="26" height="26"/><rect y="26" width="26" height="26"/><rect x="26" y="26" width="26" height="26"/><rect x="52" y="26" width="26" height="26"/></g>
    <g transform="translate(915,190)"><rect width="52" height="16"/><rect y="16" width="52" height="16"/><rect y="32" width="52" height="16"/></g>
    <g transform="translate(990,150)"><rect width="26" height="26" fill="#ffffff"/></g>
  </g>
  <text x="1003" y="194" text-anchor="middle" font-size="11" fill="#475569">단독</text>

  <!-- ④ 시뮬레이션 -->
  <g stroke="#334155" stroke-width="1.5">
    <rect x="55" y="375" width="24" height="24" fill="#bfdbfe"/><rect x="84" y="360" width="60" height="54" fill="#e2e8f0"/>
    <line x1="150" y1="372" x2="170" y2="400" stroke="#dc2626" stroke-width="3"/><line x1="170" y1="372" x2="150" y2="400" stroke="#dc2626" stroke-width="3"/>
    <rect x="55" y="440" width="24" height="24" fill="#bfdbfe"/><rect x="79" y="440" width="24" height="24" fill="#bfdbfe"/><rect x="55" y="464" width="24" height="24" fill="#bfdbfe"/><rect x="79" y="464" width="24" height="24" fill="#bfdbfe"/>
    <rect x="108" y="437" width="60" height="54" fill="#e2e8f0"/>
    <line x1="178" y1="464" x2="230" y2="464" stroke="#16a34a" stroke-width="3" marker-end="url(#ar)"/>
  </g>
  <g font-size="13" fill="#334155"><text x="190" y="392">1대: 못 민다</text><text x="240" y="469">4대: 민다</text></g>

  <!-- ⑤ 웹 뷰어 -->
  <g transform="translate(430,355)" stroke="#334155" stroke-width="1.5" fill="none">
    <rect x="0" y="0" width="240" height="140" rx="6" fill="#ffffff"/><line x1="0" y1="18" x2="240" y2="18"/>
    <circle cx="10" cy="9" r="3" fill="#f87171" stroke="none"/><circle cx="21" cy="9" r="3" fill="#fbbf24" stroke="none"/><circle cx="32" cy="9" r="3" fill="#4ade80" stroke="none"/>
    <path d="M40 75 L85 55 L130 75 L85 95 Z" fill="#bfdbfe"/><path d="M40 75 L40 105 L85 125 L85 95 Z" fill="#93c5fd"/><path d="M130 75 L130 105 L85 125 L85 95 Z" fill="#60a5fa"/>
    <line x1="160" y1="18" x2="160" y2="140"/>
    <line x1="170" y1="45" x2="230" y2="45"/><circle cx="195" cy="45" r="4" fill="#334155"/>
    <line x1="170" y1="75" x2="230" y2="75"/><circle cx="215" cy="75" r="4" fill="#334155"/>
    <line x1="170" y1="105" x2="230" y2="105"/><circle cx="182" cy="105" r="4" fill="#334155"/>
  </g>

  <!-- ⑥ 사업계획서 -->
  <g transform="translate(800,355)" stroke="#334155" stroke-width="1.5" fill="none">
    <rect x="0" y="0" width="105" height="140" fill="#ffffff"/>
    <line x1="12" y1="18" x2="70" y2="18" stroke-width="3"/>
    <line x1="12" y1="36" x2="93" y2="36"/><line x1="12" y1="48" x2="93" y2="48"/><line x1="12" y1="60" x2="80" y2="60"/>
    <rect x="16" y="108" width="14" height="20" fill="#bfdbfe"/><rect x="36" y="96" width="14" height="32" fill="#93c5fd"/><rect x="56" y="82" width="14" height="46" fill="#60a5fa"/><rect x="76" y="72" width="14" height="56" fill="#3b82f6"/>
  </g>
  <g font-size="12" fill="#334155"><text x="925" y="380">1. 문제와 시장</text><text x="925" y="405">2. 제품과 기술</text><text x="925" y="430">3. 경쟁·차별점</text><text x="925" y="455">4. 단계별 계획</text><text x="925" y="480">5. 자금 계획</text></g>

  <!-- 시간표 -->
  <text x="30" y="580" font-size="17" font-weight="700" fill="#0f172a">진행 순서</text>
  <g stroke="#ffffff" stroke-width="2">
    <rect x="30" y="595" width="260" height="46" fill="#bfdbfe"/><rect x="290" y="595" width="130" height="46" fill="#93c5fd"/><rect x="420" y="595" width="130" height="46" fill="#bfdbfe"/>
    <rect x="550" y="595" width="200" height="46" fill="#93c5fd"/><rect x="750" y="595" width="170" height="46" fill="#bfdbfe"/><rect x="920" y="595" width="150" height="46" fill="#93c5fd"/>
  </g>
  <g font-size="13" fill="#0f172a" text-anchor="middle">
    <text x="160" y="623">① 상세 설계</text><text x="355" y="623">② 도면</text><text x="485" y="623">③ 합체 형태</text><text x="650" y="623">④ 시뮬레이션</text><text x="835" y="623">⑤ 웹 뷰어</text><text x="995" y="623">정리·보고</text>
  </g>
  <text x="30" y="668" font-size="13" fill="#475569">⑥ 사업계획서 초안은 자료 조사를 맡긴 보조 작업으로 처음부터 나란히 진행합니다.</text>
  <text x="30" y="692" font-size="13" fill="#475569">모든 결과물은 GitHub의 robot-cad 폴더에 단계마다 푸시합니다. 아침에 요약 보고를 남깁니다.</text>
  <text x="30" y="716" font-size="13" fill="#b45309">크기(120mm)·바퀴 방식·첫 현장(공장 설비)은 제 가정으로 진행하며, 숫자만 바꾸면 다시 뽑을 수 있게 만듭니다.</text>
</svg>
