<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ten Drop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik+Mono+One&family=IBM+Plex+Sans+KR:wght@400;600&display=swap" rel="stylesheet">
<style>
  /* Layout: one screen — board on the left, score/next panel on the right; stacks on phones. */
  :root {
    --bg: #12141f;
    --board: #1a1d2b;
    --line: #262a3d;
    --ink: #ece9f4;
    --muted: #9092aa;
    --accent: #ffb84d;
    --font-display: "Rubik Mono One", "Arial Black", system-ui, sans-serif;
    --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
  }
  .game {
    display: grid;
    grid-template-columns: auto 200px;
    gap: 20px;
    align-items: start;
    height: 100%;
    max-height: 720px;
  }
  .board-wrap { position: relative; height: 100%; display: flex; flex-direction: column; gap: 12px; min-height: 0; }
  .board-box { position: relative; flex: 1; min-height: 0; aspect-ratio: 6 / 11; }
  canvas { display: block; width: 100%; height: 100%; border-radius: 10px; background: var(--board); outline: 1px solid var(--line); }
  .panel { display: flex; flex-direction: column; gap: 14px; }
  h1 { font-family: var(--font-display); font-weight: 400; font-size: 26px; line-height: 1; margin: 4px 0 0; letter-spacing: 0.02em; }
  h1 span { color: var(--accent); }
  .rule { color: var(--muted); font-size: 13px; line-height: 1.5; margin: 0; }
  .rule b { color: var(--ink); font-weight: 600; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .stat { background: var(--board); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
  .stat.wide { grid-column: 1 / -1; }
  .stat .label { font-size: 11px; color: var(--muted); }
  .stat .value { font-family: var(--font-display); font-size: 18px; font-variant-numeric: tabular-nums; margin-top: 2px; }
  .stat.wide .value { font-size: 26px; color: var(--accent); }
  .next { display: flex; gap: 8px; align-items: center; }
  .next canvas { width: 44px; height: 44px; outline: none; background: transparent; }
  .next canvas + canvas { width: 32px; height: 32px; opacity: 0.6; }
  .keys { font-size: 12px; color: var(--muted); line-height: 1.7; margin: 0; padding: 0; list-style: none; }
  kbd { font-family: var(--font-body); font-size: 11px; background: var(--board); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; color: var(--ink); }
  .pad { display: none; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  button {
    font-family: var(--font-body);
    font-size: 15px;
    font-weight: 600;
    color: var(--ink);
    background: var(--board);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 12px 8px;
    cursor: pointer;
  }
  button:active { transform: translateY(1px); background: var(--line); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button.primary { background: var(--accent); color: #1b1408; border-color: var(--accent); padding: 12px 22px; }
  .overlay {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    text-align: center; padding: 20px;
    background: rgba(18, 20, 31, 0.78);
    border-radius: 10px;
    backdrop-filter: blur(2px);
  }
  .overlay[hidden] { display: none; }
  .overlay h2 { font-family: var(--font-display); font-weight: 400; font-size: 24px; margin: 0; text-wrap: balance; }
  .overlay p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.6; max-width: 26ch; }
  .overlay .big { font-family: var(--font-display); color: var(--accent); font-size: 34px; }
  .example { display: flex; gap: 6px; align-items: center; justify-content: center; font-family: var(--font-display); font-size: 15px; }
  .example i { font-style: normal; width: 30px; height: 30px; border-radius: 6px; display: grid; place-items: center; color: #15131c; }
  .example em { font-style: normal; color: var(--muted); }

  @media (max-width: 560px), (pointer: coarse) {
    .pad { display: grid; }
  }
  @media (max-width: 560px) {
    body { align-items: stretch; padding: 12px; }
    .game { grid-template-columns: 1fr; grid-template-rows: auto 1fr; gap: 10px; width: 100%; max-height: none; }
    .panel { order: -1; gap: 8px; }
    .panel .rule, .panel .keys, .panel .next-label { display: none; }
    .top-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .stats { grid-template-columns: repeat(5, 1fr); gap: 6px; }
    .stat .label { font-size: 10px; white-space: nowrap; }
    .stat { padding: 4px 8px; }
    .stat.wide { grid-column: auto; }
    .stat .value, .stat.wide .value { font-size: 15px; }
    h1 { font-size: 18px; }
    .board-box { margin: 0 auto; max-width: 100%; }
  }
  @media (prefers-reduced-motion: reduce) {
    button:active { transform: none; }
  }
</style>
</head>
<body>
<main class="game">
  <section class="board-wrap">
    <div class="board-box" id="boardBox">
      <canvas id="board" aria-label="게임 보드"></canvas>
      <div class="overlay" id="overlay">
        <h2>Ten Drop</h2>
        <p>떨어지는 숫자를 붙여서 가로나 세로로 <b style="color:var(--ink)">합이 10</b>이 되게 만드세요.</p>
        <div class="example" aria-label="예시: 3 더하기 4 더하기 3은 10">
          <i style="background:#f6d04d">3</i><em>+</em><i style="background:#8bd450">4</i><em>+</em><i style="background:#f6d04d">3</i><em>=</em><span style="color:var(--accent)">10</span>
        </div>
        <p id="overlayNote">붙어 있는 2개 이상의 블록이 대상이에요.</p>
        <button class="primary" id="startBtn" type="button">시작하기</button>
      </div>
    </div>
    <div class="pad" aria-label="조작 버튼">
      <button type="button" id="btnLeft" aria-label="왼쪽으로">◀</button>
      <button type="button" id="btnRight" aria-label="오른쪽으로">▶</button>
      <button type="button" id="btnDown" aria-label="한 칸 내리기">▼</button>
      <button type="button" id="btnDrop" aria-label="바로 떨어뜨리기">⤓</button>
    </div>
  </section>

  <aside class="panel">
    <div class="top-row">
      <h1>Ten<span>Drop</span></h1>
    </div>
    <p class="rule">가로·세로로 이어진 블록의 합이 <b>정확히 10</b>이면 사라져요. 사라진 뒤 블록이 내려와 또 10이 되면 <b>연쇄</b>로 점수가 배로 올라요.</p>
    <div class="stats">
      <div class="stat wide"><div class="label">점수</div><div class="value" id="score">0</div></div>
      <div class="stat"><div class="label">최고</div><div class="value" id="best">0</div></div>
      <div class="stat"><div class="label">레벨</div><div class="value" id="level">1</div></div>
      <div class="stat"><div class="label">지운 블록</div><div class="value" id="cleared">0</div></div>
      <div class="stat"><div class="label">최대 연쇄</div><div class="value" id="maxChain">0</div></div>
    </div>
    <div>
      <div class="label next-label" style="font-size:11px;color:var(--muted);margin-bottom:6px">다음 블록</div>
      <div class="next"><canvas id="next1" width="88" height="88"></canvas><canvas id="next2" width="64" height="64"></canvas></div>
    </div>
    <ul class="keys">
      <li><kbd>←</kbd> <kbd>→</kbd> 옮기기</li>
      <li><kbd>↓</kbd> 한 칸 내리기</li>
      <li><kbd>Space</kbd> 바로 떨어뜨리기</li>
      <li><kbd>P</kbd> 일시정지</li>
    </ul>
  </aside>
</main>

<script id="logic">
// ---- Pure game logic (no DOM) ----
const COLS = 6;
const ROWS = 11;
const TARGET = 10;

function emptyGrid() {
  return Array.from({ length: ROWS }, () => Array(COLS).fill(0));
}

// Mark every contiguous horizontal/vertical run (length >= 2) whose sum is exactly TARGET.
function findClears(grid) {
  const marked = new Set();
  const scan = (get, outer, inner, key) => {
    for (let o = 0; o < outer; o++) {
      for (let s = 0; s < inner; s++) {
        let sum = 0;
        for (let e = s; e < inner; e++) {
          const v = get(o, e);
          if (!v) break;
          sum += v;
          if (sum > TARGET) break;
          if (sum === TARGET && e > s) {
            for (let k = s; k <= e; k++) marked.add(key(o, k));
          }
        }
      }
    }
  };
  scan((r, c) => grid[r][c], ROWS, COLS, (r, c) => r * COLS + c);
  scan((c, r) => grid[r][c], COLS, ROWS, (c, r) => r * COLS + c);
  return [...marked].map((i) => [Math.floor(i / COLS), i % COLS]);
}

// Let tiles fall straight down in each column.
function applyGravity(grid) {
  for (let c = 0; c < COLS; c++) {
    const stack = [];
    for (let r = ROWS - 1; r >= 0; r--) if (grid[r][c]) stack.push(grid[r][c]);
    for (let r = ROWS - 1, i = 0; r >= 0; r--, i++) grid[r][c] = stack[i] || 0;
  }
}

function landingRow(grid, col, row) {
  let r = row;
  while (r + 1 < ROWS && !grid[r + 1][col]) r++;
  return r;
}

// Points for one clear step: each tile is worth 10, multiplied by the chain count.
function scoreFor(tileCount, chain) {
  return tileCount * 10 * chain;
}

function levelFor(clearedTiles) {
  return 1 + Math.floor(clearedTiles / 20);
}

function dropInterval(level) {
  return Math.max(140, 850 - (level - 1) * 70);
}

// Two copies of 1..9 per bag, so complements (1+9, 2+8, ...) always show up.
function makeBag(rand = Math.random) {
  const bag = [];
  for (let n = 1; n <= 9; n++) bag.push(n, n);
  for (let i = bag.length - 1; i > 0; i--) {
    const j = Math.floor(rand() * (i + 1));
    [bag[i], bag[j]] = [bag[j], bag[i]];
  }
  return bag;
}

if (typeof module !== 'undefined') {
  module.exports = { COLS, ROWS, emptyGrid, findClears, applyGravity, landingRow, scoreFor, levelFor, dropInterval, makeBag };
}
</script>

<script>
// ---- Rendering and input ----
const COLORS = {
  1: '#f25f5c', 2: '#f9a03f', 3: '#f6d04d', 4: '#8bd450', 5: '#3fc1a5',
  6: '#3fa7f2', 7: '#7b86f5', 8: '#b072e8', 9: '#ec6fb3',
};
const TILE_INK = '#15131c';
const SPAWN_COL = 2;
const CLEAR_MS = 300;

const $ = (id) => document.getElementById(id);
const canvas = $('board');
const ctx = canvas.getContext('2d');
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

let bestScore = 0;
try { bestScore = Number(localStorage.getItem('tenDropBest')) || 0; } catch (e) { /* storage unavailable */ }

const state = {
  grid: emptyGrid(),
  piece: null,          // { col, row, value }
  queue: [],
  phase: 'title',       // title | playing | clearing | paused | over
  score: 0,
  cleared: 0,
  maxChain: 0,
  chain: 0,
  clearing: [],
  clearStart: 0,
  dropAcc: 0,
  popups: [],           // { text, x, y, t }
};

// A sample board shown behind the start screen.
function demoGrid() {
  const g = emptyGrid();
  const rows = [
    [0, 0, 0, 0, 0, 0],
    [0, 0, 6, 0, 0, 0],
    [0, 2, 7, 0, 5, 0],
    [8, 1, 4, 9, 3, 2],
    [3, 5, 9, 2, 6, 7],
  ];
  rows.forEach((row, i) => { g[ROWS - rows.length + i] = row.slice(); });
  return g;
}
state.grid = demoGrid();
state.piece = { col: 3, row: 3, value: 5 };

function nextValue() {
  if (state.queue.length < 3) state.queue.push(...makeBag());
  return state.queue.shift();
}

function spawn() {
  const value = nextValue();
  if (state.grid[0][SPAWN_COL]) {
    gameOver();
    return;
  }
  state.piece = { col: SPAWN_COL, row: 0, value };
  state.dropAcc = 0;
  state.chain = 0;
}

function startGame() {
  Object.assign(state, {
    grid: emptyGrid(), piece: null, queue: makeBag(), phase: 'playing',
    score: 0, cleared: 0, maxChain: 0, chain: 0, clearing: [], popups: [],
  });
  $('overlay').hidden = true;
  spawn();
  updateHud();
  canvas.focus?.();
}

function gameOver() {
  state.phase = 'over';
  state.piece = null;
  if (state.score > bestScore) {
    bestScore = state.score;
    try { localStorage.setItem('tenDropBest', String(bestScore)); } catch (e) { /* ignore */ }
  }
  updateHud();
  showOverlay('게임 오버', `<span class="big">${state.score.toLocaleString()}</span>`,
    `지운 블록 ${state.cleared}개 · 최대 연쇄 ${state.maxChain}`, '다시 하기');
}

function showOverlay(title, bigHtml, note, buttonText) {
  const o = $('overlay');
  o.innerHTML = `<h2>${title}</h2>${bigHtml}<p>${note}</p>
    <button class="primary" id="startBtn" type="button">${buttonText}</button>`;
  o.hidden = false;
  $('startBtn').addEventListener('click', buttonText === '계속하기' ? togglePause : startGame);
  $('startBtn').focus();
}

function togglePause() {
  if (state.phase === 'playing') {
    state.phase = 'paused';
    showOverlay('일시정지', '', '<kbd>P</kbd>를 다시 누르거나 아래 버튼을 눌러 계속하세요.', '계속하기');
  } else if (state.phase === 'paused') {
    state.phase = 'playing';
    $('overlay').hidden = true;
  }
}

function move(dc) {
  const p = state.piece;
  if (state.phase !== 'playing' || !p) return;
  const c = p.col + dc;
  if (c >= 0 && c < COLS && !state.grid[p.row][c]) p.col = c;
}

function softDrop() {
  const p = state.piece;
  if (state.phase !== 'playing' || !p) return;
  if (p.row + 1 < ROWS && !state.grid[p.row + 1][p.col]) {
    p.row++;
    state.score += 1;
    state.dropAcc = 0;
    updateHud();
  } else {
    lock();
  }
}

function hardDrop() {
  const p = state.piece;
  if (state.phase !== 'playing' || !p) return;
  const r = landingRow(state.grid, p.col, p.row);
  state.score += (r - p.row) * 2;
  p.row = r;
  lock();
}

function lock() {
  const p = state.piece;
  state.grid[p.row][p.col] = p.value;
  state.piece = null;
  resolve();
}

// Check for sums of 10; if found, flash them, then remove, drop, and check again (chain).
function resolve() {
  const clears = findClears(state.grid);
  if (!clears.length) {
    if (state.phase !== 'over') { state.phase = 'playing'; spawn(); }
    updateHud();
    return;
  }
  state.chain++;
  state.maxChain = Math.max(state.maxChain, state.chain);
  const gained = scoreFor(clears.length, state.chain);
  state.score += gained;
  state.cleared += clears.length;
  state.clearing = clears;
  state.clearStart = performance.now();
  state.phase = 'clearing';
  const cx = clears.reduce((s, [, c]) => s + c, 0) / clears.length;
  const cy = clears.reduce((s, [r]) => s + r, 0) / clears.length;
  state.popups.push({ text: state.chain > 1 ? `연쇄 ×${state.chain}  +${gained}` : `+${gained}`, x: cx, y: cy, t: performance.now() });
  updateHud();
}

function finishClear() {
  for (const [r, c] of state.clearing) state.grid[r][c] = 0;
  state.clearing = [];
  applyGravity(state.grid);
  resolve();
}

function updateHud() {
  $('score').textContent = state.score.toLocaleString();
  $('best').textContent = Math.max(bestScore, state.score).toLocaleString();
  $('level').textContent = levelFor(state.cleared);
  $('cleared').textContent = state.cleared;
  $('maxChain').textContent = state.maxChain;
  const upcoming = state.phase === 'title' ? [7, 3] : state.queue.slice(0, 2);
  drawPreview($('next1'), upcoming[0]);
  drawPreview($('next2'), upcoming[1]);
}

// ---- Drawing ----
let cell = 40;
function resize() {
  const box = $('boardBox');
  const dpr = window.devicePixelRatio || 1;
  // Fit a 6:11 board inside the available box.
  const availH = box.parentElement.clientHeight - (getComputedStyle($('btnLeft').parentElement).display === 'none' ? 0 : 60);
  const availW = box.parentElement.clientWidth;
  cell = Math.floor(Math.min(availW / COLS, availH / ROWS));
  cell = Math.max(cell, 20);
  box.style.width = cell * COLS + 'px';
  box.style.height = cell * ROWS + 'px';
  box.style.flex = 'none';
  canvas.width = cell * COLS * dpr;
  canvas.height = cell * ROWS * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

function roundRect(g, x, y, w, h, r) {
  g.beginPath();
  g.moveTo(x + r, y);
  g.arcTo(x + w, y, x + w, y + h, r);
  g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r);
  g.arcTo(x, y, x + w, y, r);
  g.closePath();
}

function drawTile(g, x, y, size, value, alpha = 1, glow = 0) {
  const pad = Math.max(2, size * 0.06);
  g.save();
  g.globalAlpha = alpha;
  if (glow) { g.shadowColor = '#fff'; g.shadowBlur = 18 * glow; }
  g.fillStyle = COLORS[value];
  roundRect(g, x + pad, y + pad, size - pad * 2, size - pad * 2, size * 0.16);
  g.fill();
  g.shadowBlur = 0;
  g.fillStyle = 'rgba(255,255,255,0.18)';
  roundRect(g, x + pad, y + pad, size - pad * 2, (size - pad * 2) * 0.42, size * 0.16);
  g.fill();
  g.fillStyle = TILE_INK;
  g.font = `${Math.round(size * 0.46)}px ${getComputedStyle(document.documentElement).getPropertyValue('--font-display')}`;
  g.textAlign = 'center';
  g.textBaseline = 'middle';
  g.fillText(String(value), x + size / 2, y + size / 2 + size * 0.03);
  g.restore();
}

function drawPreview(cv, value) {
  const g = cv.getContext('2d');
  g.clearRect(0, 0, cv.width, cv.height);
  if (value) drawTile(g, 0, 0, cv.width, value);
}

function draw(now) {
  const W = cell * COLS, H = cell * ROWS;
  ctx.clearRect(0, 0, W, H);

  // Grid
  ctx.strokeStyle = '#232738';
  ctx.lineWidth = 1;
  for (let c = 1; c < COLS; c++) { ctx.beginPath(); ctx.moveTo(c * cell + 0.5, 0); ctx.lineTo(c * cell + 0.5, H); ctx.stroke(); }
  for (let r = 1; r < ROWS; r++) { ctx.beginPath(); ctx.moveTo(0, r * cell + 0.5); ctx.lineTo(W, r * cell + 0.5); ctx.stroke(); }

  // Danger line under the spawn row
  ctx.fillStyle = 'rgba(242, 95, 92, 0.08)';
  ctx.fillRect(0, 0, W, cell);

  // Column guide + ghost for the falling tile
  const p = state.piece;
  if (p) {
    ctx.fillStyle = 'rgba(255, 184, 77, 0.06)';
    ctx.fillRect(p.col * cell, 0, cell, H);
    const gr = landingRow(state.grid, p.col, p.row);
    if (gr !== p.row) {
      ctx.strokeStyle = COLORS[p.value];
      ctx.globalAlpha = 0.5;
      ctx.setLineDash([4, 4]);
      roundRect(ctx, p.col * cell + 4, gr * cell + 4, cell - 8, cell - 8, cell * 0.16);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.globalAlpha = 1;
    }
  }

  // Settled tiles
  const clearingSet = new Set(state.clearing.map(([r, c]) => r * COLS + c));
  const t = state.phase === 'clearing' ? Math.min(1, (now - state.clearStart) / CLEAR_MS) : 0;
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const v = state.grid[r][c];
      if (!v) continue;
      if (clearingSet.has(r * COLS + c)) {
        const flash = reduceMotion ? 0.5 : Math.abs(Math.sin(t * Math.PI * 3));
        drawTile(ctx, c * cell, r * cell, cell, v, 1 - t * 0.6, flash);
      } else {
        drawTile(ctx, c * cell, r * cell, cell, v);
      }
    }
  }

  if (p) drawTile(ctx, p.col * cell, p.row * cell, cell, p.value);

  // Score popups
  state.popups = state.popups.filter((pp) => now - pp.t < 900);
  for (const pp of state.popups) {
    const age = (now - pp.t) / 900;
    ctx.save();
    ctx.globalAlpha = 1 - age;
    ctx.fillStyle = '#ffb84d';
    ctx.font = `${Math.round(cell * 0.4)}px ${getComputedStyle(document.documentElement).getPropertyValue('--font-display')}`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.shadowColor = 'rgba(0,0,0,0.6)';
    ctx.shadowBlur = 6;
    const x = Math.min(Math.max((pp.x + 0.5) * cell, cell * 1.6), W - cell * 1.6);
    ctx.fillText(pp.text, x, (pp.y + 0.5) * cell - (reduceMotion ? 0 : age * cell));
    ctx.restore();
  }
}

// ---- Main loop ----
let last = performance.now();
function frame(now) {
  const dt = now - last;
  last = now;
  if (state.phase === 'playing' && state.piece) {
    state.dropAcc += dt;
    const interval = dropInterval(levelFor(state.cleared));
    if (state.dropAcc >= interval) {
      state.dropAcc = 0;
      const pc = state.piece;
      if (pc.row + 1 < ROWS && !state.grid[pc.row + 1][pc.col]) pc.row++;
      else lock();
    }
  } else if (state.phase === 'clearing' && now - state.clearStart >= CLEAR_MS) {
    finishClear();
  }
  draw(now);
  requestAnimationFrame(frame);
}

// ---- Input ----
document.addEventListener('keydown', (e) => {
  if (state.phase === 'title' || state.phase === 'over') {
    if (e.key === 'Enter') { e.preventDefault(); startGame(); }
    return;
  }
  switch (e.key) {
    case 'ArrowLeft': e.preventDefault(); move(-1); break;
    case 'ArrowRight': e.preventDefault(); move(1); break;
    case 'ArrowDown': e.preventDefault(); softDrop(); break;
    case ' ': case 'ArrowUp': e.preventDefault(); hardDrop(); break;
    case 'p': case 'P': case 'Escape': e.preventDefault(); togglePause(); break;
  }
});

// Hold-to-repeat for touch buttons
function bindRepeat(id, fn) {
  const el = $(id);
  let timer = null;
  const stop = () => { clearTimeout(timer); clearInterval(timer); timer = null; };
  el.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    fn();
    timer = setTimeout(() => { timer = setInterval(fn, 70); }, 220);
  });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach((ev) => el.addEventListener(ev, stop));
}
bindRepeat('btnLeft', () => move(-1));
bindRepeat('btnRight', () => move(1));
bindRepeat('btnDown', softDrop);
$('btnDrop').addEventListener('pointerdown', (e) => { e.preventDefault(); hardDrop(); });

// Swipe / tap on the board: swipe left/right to move, swipe down to drop, tap a column to slide there.
let touch = null;
canvas.addEventListener('pointerdown', (e) => { touch = { x: e.clientX, y: e.clientY, col: null }; });
canvas.addEventListener('pointermove', (e) => {
  if (!touch || state.phase !== 'playing' || !state.piece) return;
  const dx = e.clientX - touch.x;
  const steps = Math.trunc(dx / (cell * 0.8));
  if (steps !== 0) { move(Math.sign(steps)); touch.x = e.clientX; touch.moved = true; }
});
canvas.addEventListener('pointerup', (e) => {
  if (!touch) return;
  const dy = e.clientY - touch.y;
  if (dy > cell * 1.5) hardDrop();
  touch = null;
});

$('startBtn').addEventListener('click', startGame);
window.addEventListener('resize', resize);
document.fonts?.ready.then(() => updateHud());
resize();
updateHud();
requestAnimationFrame(frame);
</script>
